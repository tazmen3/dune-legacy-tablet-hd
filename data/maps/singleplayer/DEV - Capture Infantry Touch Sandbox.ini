; DEVELOPMENT-ONLY manual regression sandbox for infantry building capture.
; Do not treat as a normal scenario. All positions are deterministic.
; Red targets use 51/256 health (19.9%), safely below the red threshold (<25%).
; Custom Game setup: choose one human player and one CPU before starting.
; Player 1 and Player 2 start on separate teams. INIMapLoader assigns the
; Player sections to the selected houses randomly, so both mirrored groups
; below provide the same five cases for whichever slot becomes the human team.
; Each infantry unit is immediately west of its labelled target:
;   (3,3) Soldier -> (5,3) enemy red Windtrap
;   (3,10) Trooper -> (5,10) enemy red Windtrap
;   (13,3) Soldier -> (15,3) enemy non-red Windtrap (128/256)
;   (13,10) Trooper -> (15,10) allied Windtrap
;   (21,10) Soldier -> (23,10) enemy non-capturable Barracks

