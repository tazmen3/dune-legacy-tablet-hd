plugins {
    id "com.android.application"
}

def androidVersionName = "0.99.5-android13"
// Increment whenever the bundled engine-data content changes.  This is kept
// separate from the application version because APK updates retain filesDir.
def bundledAssetVersion = "2026.09.09.3"
def bundledAssetRoot = "dunelegacy-data"
def generatedAssetsDir = layout.buildDirectory.dir("generated/duneLegacyAssets/main")
def assetVersionFile = "asset-version.txt"
def assetManifestFile = "asset-manifest.txt"
def proprietaryDuneDataFiles = [
    "DUNE.PAK", "SCENARIO.PAK", "MENTAT.PAK", "VOC.PAK", "MERC.PAK",
    "FINALE.PAK", "INTRO.PAK", "INTROVOC.PAK", "SOUND.PAK",
    "ENGLISH.PAK", "HARK.PAK", "ATRE.PAK", "ORDOS.PAK"
]

def verifyNoProprietaryDuneData = tasks.register("verifyNoProprietaryDuneData") {
    inputs.dir(file("../../data"))
    inputs.dir(file("../../config"))
    doLast {
        def packagedFiles = files(fileTree("../../data"), fileTree("../../config")).files
        def forbidden = packagedFiles.findAll { candidate ->
            proprietaryDuneDataFiles.any { it.equalsIgnoreCase(candidate.name) }
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException("Refusing to package proprietary Dune II data: ${forbidden*.name.join(', ')}")
        }
    }
}

def prepareDuneLegacyAssets = tasks.register("prepareDuneLegacyAssets", Sync) {
    dependsOn verifyNoProprietaryDuneData
    inputs.property("assetVersion", bundledAssetVersion)
    into generatedAssetsDir
    from(file("../../data")) {
        into bundledAssetRoot
    }
    from(file("../../config")) {
        into "${bundledAssetRoot}/config"
    }
    doLast {
        def assetRoot = new File(generatedAssetsDir.get().asFile, bundledAssetRoot)
        def marker = new File(assetRoot, assetVersionFile)
        marker.text = "${bundledAssetVersion}\n"

        def manifest = new File(assetRoot, assetManifestFile)
        def managedPaths = fileTree(assetRoot).files.findAll { candidate ->
            candidate != manifest
        }.collect { candidate ->
            assetRoot.toPath().relativize(candidate.toPath()).toString().replace('\\', '/')
        }
        managedPaths.add(assetManifestFile)
        managedPaths.sort()
        manifest.text = managedPaths.join('\n') + '\n'
    }
}

def vcpkgRoot = System.getenv("VCPKG_ROOT")
if (vcpkgRoot == null || vcpkgRoot.isBlank()) {
    throw new GradleException("VCPKG_ROOT must point to the pinned vcpkg checkout")
}

def vcpkgInstalledDir = System.getenv("VCPKG_INSTALLED_DIR")
if (vcpkgInstalledDir == null || vcpkgInstalledDir.isBlank()) {
    vcpkgInstalledDir = new File(rootProject.projectDir, "../.vcpkg-installed").canonicalPath
}

def normalizedVcpkgRoot = vcpkgRoot.replace('\\', '/')
def normalizedVcpkgInstalledDir = vcpkgInstalledDir.replace('\\', '/')

android {
    namespace "org.dunelegacy.tablethd"
    compileSdk 35
    buildToolsVersion "35.0.0"
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "org.dunelegacy.tablethd"
        minSdk 28
        targetSdk 35
        versionCode 13
        versionName androidVersionName

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_TOOLCHAIN_FILE=${normalizedVcpkgRoot}/scripts/buildsystems/vcpkg.cmake",
                          "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${android.ndkDirectory}/build/cmake/android.toolchain.cmake",
                          "-DVCPKG_TARGET_TRIPLET=arm64-android",
                          "-DVCPKG_INSTALLED_DIR=${normalizedVcpkgInstalledDir}",
                          "-DANDROID_PLATFORM=android-28",
                          "-DDUNELEGACY_ENABLE_PCH=OFF",
                          "-DDUNELEGACY_ENABLE_DISCORD_RPC=OFF"
            }
        }
    }

    signingConfigs {
        debug {
            // Reuse the existing local debug certificate so updates preserve
            // the installed application's private data.
            storeFile rootProject.file(".gradle-user-home/android-user-home/debug.keystore")
        }
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.debug

            // Keep Android's native fatal-signal handling intact in diagnostic builds.
            externalNativeBuild {
                cmake {
                    arguments "-DDUNELEGACY_ANDROID_DEBUG_DIAGNOSTICS=ON"
                }
            }
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            java.srcDir "../../external/SDL2/android-project/app/src/main/java"
            assets.srcDir generatedAssetsDir
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}

tasks.named("preBuild").configure {
    dependsOn prepareDuneLegacyAssets
}
